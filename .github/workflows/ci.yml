# Comprobaciones de cada push y cada PR. La release las reutiliza antes de
# publicar (release.yml), así que lo que se publica ha pasado exactamente esto.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Solo lectura: la CI no escribe nada en el repo.
permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la ejecución anterior, que ya
# no vale. Llamada desde la release, el grupo es el de la etiqueta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
      SQ_BIN: ${{ github.workspace }}/.squirrel/b/bin/sq_static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Ubuntu no empaqueta Squirrel. Se compila la 3.2 oficial una vez y se
      # guarda en caché; sirve para comprobar la sintaxis del pack generado.
      - name: Squirrel en caché
        id: cache-sq
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .squirrel/b/bin/sq_static
          key: squirrel-v3.2-ubuntu-24.04

      - name: Compilar Squirrel 3.2
        if: steps.cache-sq.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch v3.2 https://github.com/albertodemichelis/squirrel .squirrel
          cmake -S .squirrel -B .squirrel/b > /dev/null
          cmake --build .squirrel/b -j4 --target sq_static > /dev/null

      - name: Tests
        run: |
          python -m pip install --quiet "pytest>=8"
          python -m pytest -q

      # --estricto falla si la sintaxis no pasa, si hay patrones en cuarentena
      # o si algún aviso de calidad sube sobre su línea base.
      - name: Build del pack
        run: python es_pack/tools/build_dist.py --estricto

      # Node viene en la imagen del runner. Solo se comprueba que cada .js
      # parsea: un error de sintaxis en la capa de interfaz rompe una pantalla
      # entera en el juego, y nada más lo detectaría antes de publicar.
      - name: Sintaxis de la capa de interfaz
        run: find es_pack/src/ui -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build de la capa de interfaz
        run: python es_pack/tools/build_ui_addon.py

      - name: El cuadro del README sale del corpus real
        run: python es_pack/tools/update_readme_metrics.py --check

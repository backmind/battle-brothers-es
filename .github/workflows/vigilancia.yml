# Cada lunes mira si el juego, MSU o Rosetta han publicado algo que toque lo que el pack
# usa de ellos. No construye ni publica nada: si encuentra algo, abre una issue
# (o comenta en la que ya esté abierta) con el informe.
name: vigilancia
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # La última release de MSU, que es lo que instalan los jugadores.
      - name: MSU
        run: |
          gh release download --repo MSUTeam/MSU --pattern '*.zip' --dir msu
          version=$(gh release view --repo MSUTeam/MSU --json tagName --jq .tagName)
          {
            echo "## MSU $version"
            echo '```'
            python es_pack/tools/check_msu_drift.py msu/*.zip && echo ok > msu.ok
            echo '```'
          } >> informe.md || true

      # Rosetta no publica releases en GitHub: se toma la etiqueta semver más
      # alta, que es la versión que sube a Nexus.
      - name: Rosetta
        run: |
          repo=https://github.com/Suor/battle-brothers-rosetta
          tag=$(git ls-remote --tags --refs "$repo" | awk -F/ '{print $3}' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          curl -sfL "https://raw.githubusercontent.com/Suor/battle-brothers-rosetta/$tag/scripts/!mods_preload/!rosetta.nut" -o rosetta.nut
          {
            echo "## Rosetta $tag"
            echo '```'
            python es_pack/tools/check_upstream_drift.py rosetta.nut && echo ok > rosetta.ok
            echo '```'
          } >> informe.md || true

      # Steam solo publica un número de build; GOG publica la versión tal cual
      # la muestra el juego. Se toma la última build pública (sin rama beta)
      # y se compara con GAME_VERSION, la build contra la que se verificó.
      - name: Juego
        run: |
          ultima=$(curl -sf "https://content-system.gog.com/products/1590012242/os/windows/builds?generation=2" \
                   | jq -r '[.items[] | select(.branch == null)][0].version_name')
          nuestra=$(cd es_pack/tools && python -c "import build_dist; print(build_dist.GAME_VERSION)")
          {
            echo "## Battle Brothers $ultima"
            if [ "$ultima" = "$nuestra" ]; then
              echo "El pack está verificado contra esta versión."
              echo ok > juego.ok
            else
              echo "El pack está verificado contra la $nuestra y ha salido la $ultima."
              echo "Toca pasar check_ui_drift.py y measure_coverage.py contra ella, jugar"
              echo "una partida y, si todo cuadra, subir GAME_VERSION y GameVersion."
            fi
          } >> informe.md

      - name: Informe
        run: |
          cat informe.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f msu.ok ] && [ -f rosetta.ok ] && [ -f juego.ok ]; then exit 0; fi
          titulo="Vigilancia: el juego, MSU o Rosetta han cambiado"
          abierta=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number')
          if [ -n "$abierta" ]; then
            gh issue comment "$abierta" --body-file informe.md
          else
            gh issue create --title "$titulo" --body-file informe.md
          fi

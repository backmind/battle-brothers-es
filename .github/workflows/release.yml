# Al empujar una etiqueta 1.2.3 (semver puro, sin v: lo exige el aviso de
# actualizaciones de MSU): pasa las comprobaciones, construye los dos
# zips y crea la release de GitHub con el apartado del CHANGELOG. Los builds
# son deterministas, así que los zips son los mismos que salen en local.
name: release
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

# Solo lectura por defecto; el trabajo que publica pide escritura él solo.
permissions:
  contents: read

jobs:
  comprobaciones:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: comprobaciones
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Construir los zips
        run: |
          python es_pack/tools/build_dist.py
          python es_pack/tools/build_ui_addon.py

      - name: La etiqueta coincide con la versión del pack
        run: |
          version="$GITHUB_REF_NAME"
          test -f "es_pack/build/mod_battle_brothers_es_${version}.zip"
          test -f "es_pack/build/mod_battle_brothers_es_ui_${version}.zip"

      - name: Notas de la versión desde el CHANGELOG
        run: |
          version="$GITHUB_REF_NAME"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dentro = 1; next }
            index($0, "## [") == 1 && dentro { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --title "Battle Brothers en Español $version" \
            --notes-file notas.md \
            "es_pack/build/mod_battle_brothers_es_${version}.zip" \
            "es_pack/build/mod_battle_brothers_es_ui_${version}.zip"
